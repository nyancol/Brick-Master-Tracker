kind = "web"
previewPath = "/"
title = "Brick Tracker"
version = "1.0.0"
id = "artifacts/brick-tracker"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22170

[services.development]
run = "pnpm --filter @workspace/brick-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/brick-tracker", "run", "build" ]
publicDir = "artifacts/brick-tracker/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22170"
BASE_PATH = "/"
