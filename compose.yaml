services:
  brick-tracker:
    container_name: brick-tracker
    build:
      context: .
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5000"
    env_file:
      - .env
    networks:
      - caddy_public
    volumes:
      - ${DATA_PATH:-./brick-tracker-data}:/app/data

networks:
  caddy_public:
    driver: bridge
    external: true
    name: "caddy_public"
