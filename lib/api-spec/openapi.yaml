openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Lego Brick Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bricks
    description: Brick state and transfers
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bricks:
    get:
      operationId: getBricks
      tags: [bricks]
      summary: Get current brick holders
      description: Returns the current state of both bricks (who holds each one)
      responses:
        "200":
          description: Brick states
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BrickState"

  /bricks/{color}/transfer:
    post:
      operationId: transferBrick
      tags: [bricks]
      summary: Transfer a brick to someone
      parameters:
        - name: color
          in: path
          required: true
          schema:
            type: string
            enum: [red, blue]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferInput"
      responses:
        "200":
          description: Transfer successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrickState"
        "400":
          description: Invalid transfer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /transfers:
    get:
      operationId: getTransfers
      tags: [bricks]
      summary: Get transfer history
      description: Returns the full history of brick transfers, most recent first
      responses:
        "200":
          description: Transfer history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transfer"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    BrickState:
      type: object
      required: [color, holder, updatedAt]
      properties:
        color:
          type: string
          enum: [red, blue]
        holder:
          type: string
          description: Name of the current brick holder
        updatedAt:
          type: string
          format: date-time

    TransferInput:
      type: object
      required: [to]
      properties:
        to:
          type: string
          description: Name of the person to transfer the brick to

    Transfer:
      type: object
      required: [id, color, fromHolder, toHolder, transferredAt]
      properties:
        id:
          type: integer
        color:
          type: string
          enum: [red, blue]
        fromHolder:
          type: string
        toHolder:
          type: string
        transferredAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
