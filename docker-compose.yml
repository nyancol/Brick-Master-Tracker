services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 database
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Fall back to individual variables when DATABASE_URL is not set
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB:       ${POSTGRES_DB:-brickmaster}
      # Full connection string (takes precedence when set)
      DATABASE_URL:       ${DATABASE_URL:-}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Initialise the database on first start (runs before postgres starts)
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      # Persistent data across restarts
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Node.js API server (production build)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:        ${APP_PORT:-5000}
      NODE_ENV:    production
      # Construct DATABASE_URL from individual vars when not explicitly set
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-brickmaster}}
    ports:
      - "${APP_PORT:-5000}:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db_data:
