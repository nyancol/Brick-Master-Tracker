# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# Requires that any npm package version must have been published for at least
# 1 day (1440 minutes) before pnpm will allow installing it. Strong defense
# against supply-chain attacks; do not disable.
#
# If you absolutely need a package before the 1-day window (e.g. an urgent
# security bugfix), add it to `minimumReleaseAgeExclude` below and remove the
# exclusion once the window has passed.
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - '@replit/*'

packages:
  - artifacts/*

catalog:
  '@tailwindcss/vite': ^4.1.14
  '@tanstack/react-query': ^5.90.21
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  lucide-react: ^0.545.0
  # Pinned to 19.1.0 (was required for Expo; kept for now).
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - '@swc/core'
  - better-sqlite3
  - esbuild
  - msw
  - unrs-resolver

allowBuilds:
  better-sqlite3: true
  esbuild: true
